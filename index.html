<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo-g3i.png" />

    <title>G3i Inmobiliaria</title>
    <meta name="description" content="Casas, departamentos, terrenos y proyectos en venta en Cumbayá, Tumbaco y el valle de Quito." />
    <meta name="theme-color" content="#071c30" />

    <!-- Open Graph / social (WhatsApp es el canal principal de compartir) -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_EC" />
    <meta property="og:site_name" content="G3i Inmobiliaria" />
    <meta property="og:title" content="G3i Inmobiliaria" />
    <meta property="og:description" content="Casas, departamentos, terrenos y proyectos en venta en Cumbayá, Tumbaco y el valle de Quito." />
    <meta property="og:url" content="https://g3i.ec" />
    <meta property="og:image" content="https://g3i.ec/logo-g3i.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fuentes: siempre con <link>, nunca @import dentro del SCSS inyectado -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Font Awesome Free por CDN; iconos como <i class="fa-solid fa-…"> -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />
    <!-- Datos de la inmobiliaria para buscadores (schema.org) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "RealEstateAgent",
        "name": "G3i Negocios Inmobiliarios",
        "alternateName": "Grupo 3 Inversiones",
        "url": "https://g3i.ec",
        "logo": "https://g3i.ec/logo-g3i.png",
        "slogan": "¡Sueña, siente, vive tu espacio!",
        "email": "ventas@g3i.ec",
        "telephone": "+593995806119",
        "areaServed": ["Cumbayá", "Tumbaco", "Puembo", "Nayón", "Pifo", "Checa", "Quito"],
        "address": { "@type": "PostalAddress", "addressLocality": "Cumbayá", "addressRegion": "Pichincha", "addressCountry": "EC" },
        "sameAs": ["https://www.instagram.com/inmobiliaria.g3i/", "https://www.facebook.com/Grupo3Inversiones/"]
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
